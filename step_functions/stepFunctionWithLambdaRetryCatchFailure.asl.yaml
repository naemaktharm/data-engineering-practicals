Comment: A description of my state machine
StartAt: Choice
States:
  Choice:
    Type: Choice
    Choices:
      - Next: Purchase Lambda Invoke Handler
        And:
          - Variable: $.type
            IsPresent: true
          - Variable: $.type
            StringMatches: purchase
          - Variable: $.item
            StringMatches: '12'
      - Next: Refund Lambda Invoke Handler
        And:
          - Variable: $.type
            IsPresent: true
          - Variable: $.type
            StringMatches: refund
          - Variable: $.item
            StringMatches: '1'
    Default: Result Lambda Invoke Handler
  Purchase Lambda Invoke Handler:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:purchaseLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Wait (1)
  Wait (1):
    Type: Wait
    Seconds: 5
    Next: SQS after Purchase Handler
  SQS after Purchase Handler:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      MessageBody.$: $
      QueueUrl: https://sqs.us-east-1.amazonaws.com/026343683315/purchaseSQS
    Next: Result Lambda Invoke Handler
  Result Lambda Invoke Handler:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:resultLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 10
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Wait
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: SQS after Catching Error
  Wait:
    Type: Wait
    Seconds: 5
    Next: SQS after Result Handler
  SQS after Result Handler:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      MessageBody.$: $
      QueueUrl: https://sqs.us-east-1.amazonaws.com/026343683315/ResultSQS
    Next: SQS after Catching Error
  SQS after Catching Error:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      MessageBody.$: $
      QueueUrl: https://sqs.us-east-1.amazonaws.com/026343683315/ResultSQSCatch
    Next: Fail
  Fail:
    Type: Fail
  Refund Lambda Invoke Handler:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:refundLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Wait (2)
  Wait (2):
    Type: Wait
    Seconds: 5
    Next: SQS after Refund Handler
  SQS after Refund Handler:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      MessageBody.$: $
      QueueUrl: https://sqs.us-east-1.amazonaws.com/026343683315/RefundSQS
    Next: Result Lambda Invoke Handler
QueryLanguage: JSONPath
