Comment: A description of my state machine
StartAt: Choice Conditional Trigger
States:
  Choice Conditional Trigger:
    Type: Choice
    Choices:
      - Next: Purchase Lambda Handler Invoke
        And:
          - Variable: $.type
            IsPresent: true
          - Variable: $.type
            StringMatches: purchase
      - Next: Refund Lambda Handler Invoke
        And:
          - Variable: $.type
            IsPresent: true
          - Variable: $.type
            StringMatches: refund
    Default: Result Lambda Handler Invoke
  Purchase Lambda Handler Invoke:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:purchaseLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Result Lambda Handler Invoke
  Result Lambda Handler Invoke:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:resultLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Wait
  Wait:
    Type: Wait
    Seconds: 5
    Next: SQS SendMessage
  SQS SendMessage:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      MessageBody.$: $
      QueueUrl: https://sqs.us-east-1.amazonaws.com/026343683315/StepFunctionsSQS
    End: true
  Refund Lambda Handler Invoke:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    OutputPath: $.Payload
    Parameters:
      Payload.$: $
      FunctionName: >-
        arn:aws:lambda:us-east-1:026343683315:function:refundLambdaInvokeHandler:$LATEST
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Next: Result Lambda Handler Invoke
QueryLanguage: JSONPath
